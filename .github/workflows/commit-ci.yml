name: Commit
on:
  workflow_dispatch:  # 仅手动触发（Actions 页面点 Run workflow）

env:
  CI_NAME: Commit CI
jobs:
  build:
    runs-on: ubuntu-26.04
    env:
      BUILD_ABI: arm64-v8a  # 只构建 arm64-v8a
    steps:
      - name: Fetch source code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: 25
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android NDK
        run: |
          sdkmanager --install "cmake;3.31.6"

      - name: Calculate JNI cache hash
        id: cache-hash
        run: |
          ./gradlew :app:calculateNativeCacheHash

      - name: Fetch JNI cache
        uses: actions/cache@v6
        id: jni-cache
        with:
          path: "app/prebuilt"
          key: ${{ runner.os }}-trime-jni-release-arm64-${{ steps.cache-hash.outputs.native-cache-hash }}

      - name: Fetch submodules
        if: ${{ !steps.jni-cache.outputs.cache-hit }}
        run: |
          git submodule update --init --recursive

      # 使用仓库里固定的签名文件，保证每次构建签名一致，可以覆盖安装
      - name: Setup Keystore
        run: |
          printf 'storeFile=%s\nstorePassword=trime123\nkeyAlias=trime\nkeyPassword=trime123\n' \
            "$PWD/.github/signing/trime-zj.p12" > keystore.properties

      - name: Build release Trime
        run: |
          make release

      - name: Add JNI cache
        if: ${{ !steps.jni-cache.outputs.cache-hit }}
        shell: bash
        run: cp -R app/build/intermediates/merged_native_libs/release/mergeReleaseNativeLibs/out/lib app/prebuilt

      - name: Upload APK artifact (arm64-v8a release)
        uses: actions/upload-artifact@v7
        with:
          name: trime-release-arm64-v8a
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90
